<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradP3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110d24"/>
      <stop offset="50%" stop-color="#161233"/>
      <stop offset="100%" stop-color="#0b0a1a"/>
    </linearGradient>
    <linearGradient id="purpleNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glassP3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 27, 75, 0.7)"/>
      <stop offset="100%" stop-color="rgba(15, 12, 41, 0.85)"/>
    </linearGradient>
    <filter id="p3Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#bgGradP3)"/>
  
  <circle cx="160" cy="100" r="100" fill="#8b5cf6" opacity="0.12" filter="url(#p3Glow)"/>
  <circle cx="460" cy="220" r="120" fill="#ec4899" opacity="0.1" filter="url(#p3Glow)"/>

  <!-- Academic Productivity Dashboard -->
  <g transform="translate(45, 30)">
    <rect width="510" height="290" rx="12" fill="url(#glassP3)" stroke="rgba(167, 139, 250, 0.25)" stroke-width="1.5"/>

    <!-- App Header -->
    <rect x="0" y="0" width="510" height="42" rx="12" fill="#1e1b4b" opacity="0.8"/>
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="5" fill="#10b981"/>

    <text x="80" y="25" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#ddd6fe">STUDYFLOW // CSE WORKSPACE</text>

    <!-- Sidebar in Mockup -->
    <g transform="translate(18, 55)">
      <rect width="105" height="215" rx="8" fill="#1e1b4b" opacity="0.5"/>
      <rect x="12" y="15" width="80" height="18" rx="4" fill="#6d28d9"/>
      <text x="52" y="27" font-family="sans-serif" font-size="9" font-weight="bold" fill="#f5f3ff" text-anchor="middle">Resources</text>
      
      <rect x="12" y="45" width="80" height="14" rx="4" fill="#312e81"/>
      <text x="52" y="55" font-family="sans-serif" font-size="8" fill="#c4b5fd" text-anchor="middle">Assignments</text>

      <rect x="12" y="68" width="80" height="14" rx="4" fill="#312e81"/>
      <text x="52" y="78" font-family="sans-serif" font-size="8" fill="#c4b5fd" text-anchor="middle">Exam Prep</text>

      <rect x="12" y="91" width="80" height="14" rx="4" fill="#312e81"/>
      <text x="52" y="101" font-family="sans-serif" font-size="8" fill="#c4b5fd" text-anchor="middle">Code Snippets</text>

      <rect x="12" y="114" width="80" height="14" rx="4" fill="#312e81"/>
      <text x="52" y="124" font-family="sans-serif" font-size="8" fill="#c4b5fd" text-anchor="middle">Schedule</text>
    </g>

    <!-- Main Workspace Content -->
    <g transform="translate(138, 55)">
      <!-- Top Task Progress -->
      <rect width="352" height="70" rx="8" fill="#1e1b4b" stroke="rgba(255, 255, 255, 0.08)"/>
      <text x="16" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#f5f3ff">Semester Milestones &amp; Resource Hub</text>
      <text x="16" y="40" font-family="sans-serif" font-size="9" fill="#a78bfa">DSA Practice • Operating Systems • Web Architecture</text>
      
      <rect x="16" y="50" width="320" height="6" rx="3" fill="#312e81"/>
      <rect x="16" y="50" width="240" height="6" rx="3" fill="url(#purpleNeon)"/>

      <!-- Resource Grid -->
      <g transform="translate(0, 82)">
        <!-- Card 1 -->
        <rect x="0" y="0" width="168" height="133" rx="8" fill="#1e1b4b" stroke="rgba(139, 92, 246, 0.2)"/>
        <circle cx="24" cy="24" r="10" fill="#7c3aed"/>
        <text x="24" y="28" font-family="monospace" font-size="10" fill="#fff" text-anchor="middle">&lt;/&gt;</text>
        <text x="42" y="26" font-family="sans-serif" font-size="10" font-weight="600" fill="#ede9fe">DSA Cheatsheets</text>
        <text x="16" y="50" font-family="sans-serif" font-size="8.5" fill="#a78bfa">Binary Search, Graphs, Dynamic Programming</text>
        <rect x="16" y="70" width="70" height="18" rx="4" fill="#312e81"/>
        <text x="51" y="82" font-family="sans-serif" font-size="8" fill="#ddd6fe" text-anchor="middle">42 Notes</text>
        <rect x="16" y="98" width="136" height="22" rx="4" fill="url(#purpleNeon)"/>
        <text x="84" y="112" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#fff" text-anchor="middle">Open Vault</text>

        <!-- Card 2 -->
        <rect x="184" y="0" width="168" height="133" rx="8" fill="#1e1b4b" stroke="rgba(236, 72, 153, 0.2)"/>
        <circle cx="208" cy="24" r="10" fill="#db2777"/>
        <text x="208" y="28" font-family="monospace" font-size="9" fill="#fff" text-anchor="middle">⏱</text>
        <text x="226" y="26" font-family="sans-serif" font-size="10" font-weight="600" fill="#fdf2f8">Pomodoro &amp; Tasks</text>
        <text x="200" y="50" font-family="sans-serif" font-size="8.5" fill="#f472b6">Focus sprint: 25m active study session</text>
        <rect x="200" y="70" width="70" height="18" rx="4" fill="#831843"/>
        <text x="235" y="82" font-family="sans-serif" font-size="8" fill="#fbcfe8" text-anchor="middle">3 Tasks Due</text>
        <rect x="200" y="98" width="136" height="22" rx="4" fill="#374151"/>
        <text x="268" y="112" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#e5e7eb" text-anchor="middle">Start Session</text>
      </g>
    </g>
  </g>
</svg>
