<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="photoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101b" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Subtle Accent Border Gradient -->
    <linearGradient id="photoBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Monogram Circle Gradient -->
    <linearGradient id="monogramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Inner Card Glow -->
    <filter id="photoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="400" height="400" rx="24" fill="url(#photoBgGrad)"/>

  <!-- Subtle Blueprint Tech Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="0" y1="350" x2="400" y2="350"/>
  </g>

  <!-- Ambient Glow Behind Photo Frame -->
  <circle cx="200" cy="165" r="75" fill="#38bdf8" opacity="0.12" filter="url(#photoGlow)"/>

  <!-- Professional Portrait Silhouette Frame -->
  <g transform="translate(115, 80)">
    <!-- Outer Decorative Dash Ring -->
    <circle cx="85" cy="85" r="82" fill="none" stroke="url(#photoBorderGrad)" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"/>
    
    <!-- Photo Inner Circle -->
    <circle cx="85" cy="85" r="74" fill="#0f172a" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>

    <!-- Professional Developer Silhouette -->
    <!-- Head -->
    <circle cx="85" cy="62" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    
    <!-- Shoulders -->
    <path d="M 40 142 C 45 106, 65 98, 85 98 C 105 98, 125 106, 130 142 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 72 100 L 85 116 L 98 100" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Camera / Photo Replace Badge -->
    <g transform="translate(115, 115)">
      <circle cx="16" cy="16" r="15" fill="#0f172a" stroke="#00f2fe" stroke-width="1.5"/>
      <path d="M 10 17 L 12 13 L 20 13 L 22 17 Z" fill="#38bdf8"/>
      <circle cx="16" cy="19" r="4.5" fill="#1e293b" stroke="#00f2fe" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Student Name & Title Label -->
  <text x="200" y="295" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="-0.3">
    Nasar Farooque
  </text>
  <text x="200" y="318" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#38bdf8" text-anchor="middle">
    BTech CSE • Jain University
  </text>

  <!-- Clear Instruction Badge for Photo Upload -->
  <g transform="translate(55, 342)">
    <rect width="290" height="28" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <text x="145" y="18" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">
      [ADD PROFILE PHOTO: assets/images/]
    </text>
  </g>
</svg>
