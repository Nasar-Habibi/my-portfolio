<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradP1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.8)"/>
    </linearGradient>
    <filter id="p1Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#bgGradP1)"/>
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="150" cy="120" r="100" fill="#0284c7" opacity="0.15" filter="url(#p1Glow)"/>
  <circle cx="480" cy="240" r="120" fill="#6366f1" opacity="0.12" filter="url(#p1Glow)"/>

  <!-- Browser Frame Mockup -->
  <g transform="translate(40, 30)">
    <!-- Browser Window Container -->
    <rect width="520" height="290" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
    
    <!-- Window Bar -->
    <path d="M 0 12 Q 0 0 12 0 L 508 0 Q 520 0 520 12 L 520 36 L 0 36 Z" fill="#1e293b"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    
    <!-- URL Bar -->
    <rect x="80" y="8" width="300" height="20" rx="6" fill="#0f172a" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="96" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">https://nasarfarooque.dev</text>

    <!-- Mockup Hero Content -->
    <!-- Nav line in mockup -->
    <rect x="25" y="55" width="60" height="12" rx="4" fill="#38bdf8"/>
    <rect x="360" y="57" width="30" height="8" rx="3" fill="#64748b"/>
    <rect x="400" y="57" width="30" height="8" rx="3" fill="#64748b"/>
    <rect x="440" y="57" width="55" height="14" rx="7" fill="url(#neonCyan)"/>

    <!-- Left Column: Title & Text -->
    <rect x="25" y="90" width="130" height="8" rx="4" fill="rgba(56, 189, 248, 0.5)"/>
    <rect x="25" y="110" width="220" height="18" rx="4" fill="#f8fafc"/>
    <rect x="25" y="136" width="180" height="14" rx="4" fill="url(#neonCyan)"/>
    <rect x="25" y="165" width="230" height="6" rx="3" fill="#64748b"/>
    <rect x="25" y="178" width="200" height="6" rx="3" fill="#64748b"/>
    <rect x="25" y="191" width="160" height="6" rx="3" fill="#475569"/>

    <!-- CTA buttons in mockup -->
    <rect x="25" y="215" width="80" height="24" rx="6" fill="url(#neonCyan)"/>
    <rect x="115" y="215" width="70" height="24" rx="6" fill="none" stroke="#64748b" stroke-width="1.2"/>

    <!-- Right Column: Card Graphic -->
    <rect x="290" y="85" width="205" height="160" rx="10" fill="#0f172a" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
    <circle cx="392" cy="140" r="32" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="392" y="145" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">&lt;NF/&gt;</text>
    
    <rect x="315" y="190" width="155" height="8" rx="4" fill="#334155"/>
    <rect x="330" y="205" width="125" height="8" rx="4" fill="#38bdf8" opacity="0.6"/>
    <rect x="345" y="220" width="95" height="8" rx="4" fill="#6366f1" opacity="0.6"/>

    <!-- Floating tag chip -->
    <g transform="translate(260, 160)">
      <rect width="85" height="24" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2" filter="url(#p1Glow)"/>
      <text x="42" y="16" font-family="sans-serif" font-size="10" font-weight="bold" fill="#c7d2fe" text-anchor="middle">Responsive</text>
    </g>
  </g>
</svg>
