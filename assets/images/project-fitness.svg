<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradP2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09141f"/>
      <stop offset="50%" stop-color="#061e24"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>
    <linearGradient id="emeraldNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glassP2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.75)"/>
      <stop offset="100%" stop-color="rgba(6, 78, 59, 0.25)"/>
    </linearGradient>
    <filter id="p2Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#bgGradP2)"/>
  
  <!-- Subtle decorative ambient circles -->
  <circle cx="120" cy="180" r="110" fill="#10b981" opacity="0.12" filter="url(#p2Glow)"/>
  <circle cx="480" cy="100" r="100" fill="#06b6d4" opacity="0.1" filter="url(#p2Glow)"/>

  <!-- Main Fitness App Dashboard Mockup -->
  <g transform="translate(45, 30)">
    <!-- Container -->
    <rect width="510" height="290" rx="12" fill="url(#glassP2)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5"/>

    <!-- App Header -->
    <rect x="0" y="0" width="510" height="42" rx="12" fill="#0f172a" opacity="0.9"/>
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="5" fill="#10b981"/>

    <!-- Fitness Brand Logo Icon -->
    <g transform="translate(85, 12)">
      <circle cx="9" cy="9" r="8" fill="url(#emeraldNeon)"/>
      <path d="M 5 9 L 8 6 L 10 12 L 13 9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <text x="24" y="13" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#f8fafc">FITPULSE</text>
    </g>

    <!-- Stat Card 1: Active Calories -->
    <g transform="translate(25, 60)">
      <rect width="140" height="85" rx="8" fill="#111827" stroke="rgba(255, 255, 255, 0.08)"/>
      <text x="14" y="24" font-family="sans-serif" font-size="10" fill="#94a3b8">Active Calories</text>
      <text x="14" y="52" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">640 <tspan font-size="11" font-weight="normal" fill="#10b981">kcal</tspan></text>
      <path d="M 14 70 C 40 62, 70 76, 126 62" fill="none" stroke="#10b981" stroke-width="2"/>
    </g>

    <!-- Stat Card 2: Workout Time -->
    <g transform="translate(185, 60)">
      <rect width="140" height="85" rx="8" fill="#111827" stroke="rgba(255, 255, 255, 0.08)"/>
      <text x="14" y="24" font-family="sans-serif" font-size="10" fill="#94a3b8">Daily Activity</text>
      <text x="14" y="52" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">48 <tspan font-size="11" font-weight="normal" fill="#06b6d4">mins</tspan></text>
      <rect x="14" y="66" width="112" height="6" rx="3" fill="#1f2937"/>
      <rect x="14" y="66" width="84" height="6" rx="3" fill="url(#emeraldNeon)"/>
    </g>

    <!-- Stat Card 3: Heart Rate / Pulse -->
    <g transform="translate(345, 60)">
      <rect width="140" height="85" rx="8" fill="#111827" stroke="rgba(255, 255, 255, 0.08)"/>
      <text x="14" y="24" font-family="sans-serif" font-size="10" fill="#94a3b8">Heart Rate</text>
      <text x="14" y="52" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">128 <tspan font-size="11" font-weight="normal" fill="#f43f5e">bpm</tspan></text>
      <!-- ECG Wave -->
      <path d="M 14 68 L 40 68 L 48 56 L 56 78 L 64 62 L 72 70 L 126 70" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <!-- Bottom Chart: Weekly Routine & Breakdown -->
    <g transform="translate(25, 160)">
      <rect width="460" height="110" rx="8" fill="#111827" stroke="rgba(255, 255, 255, 0.08)"/>
      <text x="16" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Weekly Performance Breakdown</text>
      
      <!-- Bar Chart -->
      <g transform="translate(20, 35)">
        <!-- Mon -->
        <rect x="10" y="35" width="22" height="25" rx="3" fill="#1f2937"/>
        <rect x="10" y="20" width="22" height="40" rx="3" fill="#10b981"/>
        <text x="21" y="70" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">M</text>

        <!-- Tue -->
        <rect x="60" y="10" width="22" height="50" rx="3" fill="#06b6d4"/>
        <text x="71" y="70" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">T</text>

        <!-- Wed -->
        <rect x="110" y="28" width="22" height="32" rx="3" fill="#10b981"/>
        <text x="121" y="70" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">W</text>

        <!-- Thu -->
        <rect x="160" y="5" width="22" height="55" rx="3" fill="url(#emeraldNeon)"/>
        <text x="171" y="70" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">T</text>

        <!-- Fri -->
        <rect x="210" y="22" width="22" height="38" rx="3" fill="#06b6d4"/>
        <text x="221" y="70" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">F</text>

        <!-- Sat -->
        <rect x="260" y="15" width="22" height="45" rx="3" fill="#10b981"/>
        <text x="271" y="70" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">S</text>

        <!-- Sun -->
        <rect x="310" y="38" width="22" height="22" rx="3" fill="#475569"/>
        <text x="321" y="70" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">S</text>
      </g>

      <!-- Circular progress metric on right -->
      <g transform="translate(390, 60)">
        <circle cx="20" cy="20" r="22" fill="none" stroke="#1f2937" stroke-width="5"/>
        <circle cx="20" cy="20" r="22" fill="none" stroke="#10b981" stroke-width="5" stroke-dasharray="100 38" stroke-linecap="round"/>
        <text x="20" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">82%</text>
        <text x="20" y="48" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Goal Done</text>
      </g>
    </g>
  </g>
</svg>
